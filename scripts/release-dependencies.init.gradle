import groovy.json.JsonOutput

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('writeReleaseDependencyInventory') {
        group = 'verification'
        description = 'Record the exact artifacts used by the release runtime classpath.'
        doLast {
            def artifacts = app.configurations.releaseRuntimeClasspath
                .resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                    [
                        coordinate: artifact.moduleVersion.id.toString(),
                        artifact: artifact.file.name,
                        path: artifact.file.absolutePath,
                    ]
                }.sort { it.coordinate }
            def target = app.layout.buildDirectory
                .file('outputs/licenses/resolved-artifacts.json').get().asFile
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(artifacts)) + '\n'
            println "Recorded ${artifacts.size()} release artifacts: ${target}"
        }
    }
}
